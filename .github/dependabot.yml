version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /tools/export
    schedule:
      interval: monthly
    groups:
      export-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # pyproject.toml caps transformers below 4.58 for the ONNX export.
      - dependency-name: transformers
        versions: [">=4.58"]
      # Every transformers below 4.58 needs huggingface_hub below 1.0.
      - dependency-name: huggingface_hub
        versions: [">=1.0"]
      # optimum follows optimum-onnx, which pins its own optimum range.
      - dependency-name: optimum
      # onnx 1.23 saves models as IR version 14, which onnxruntime 1.29 cannot load yet.
      - dependency-name: onnx
        versions: [">=1.23"]
