name: Other browsers
# The rendering checks in Firefox and WebKit. Started by hand after larger changes
# to the design; CI and the deploy do not wait for it.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps firefox webkit
      - run: npm run e2e:browsers
