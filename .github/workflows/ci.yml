name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Chromium only and without the design check, to keep a push short: the design check runs
      # beside this workflow (design.yml), Firefox and WebKit run by hand (browsers.yml)
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
