<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        var t = 'light';
        try {
          var v = localStorage.getItem('tsumugi.theme');
          if (v === 'light' || v === 'dark') t = v;
          else if (window.matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
        } catch (e) {
          try { if (window.matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark'; } catch (e2) {}
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <title>紬 Tsumugi — Watch a language model write, one token at a time</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
